<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TakeOff Talent Auth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 420px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: white;
            color: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            background: white;
            color: #333;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .google-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">T</div>

        <h1>Welcome Back</h1>

        <p>
            Sign in securely with your Google account to continue to the
            FastAPI authentication dashboard.
        </p>

        <a href="/login" class="google-btn">
            <span>🔐</span>
            Continue with Google
        </a>

        <div class="footer">
            TakeOff Talent Assignment • FastAPI OAuth
        </div>
    </div>

</body>
</html>
